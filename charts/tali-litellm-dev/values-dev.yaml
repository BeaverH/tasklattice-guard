# OrbStack / Docker Desktop profile for the LiteLLM integration test stack.
# Preload the LiteLLM proxy image before deploying. The mock model reuses
# the locally built Guard Runner image; bootstrap reuses the Controller image.
image:
  pullPolicy: Never
service:
  type: LoadBalancer
  port: 38083
model:
  mock:
    image:
      tag: dev
      pullPolicy: Never
bootstrap:
  image:
    tag: dev
    pullPolicy: Never
postgresql:
  image:
    pullPolicy: Never
