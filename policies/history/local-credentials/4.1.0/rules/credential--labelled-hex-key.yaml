id: credential/labelled-hex-key
name: Labelled hexadecimal key
description: Detect a hexadecimal key assignment at common symmetric key lengths; bare digests and hash-labelled
  values do not match.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w])(?:key|encryption[_-]?key)(?:\\?["'])?(?:\s*\])?\s*[:=：]\s*["']?(?:[a-f0-9]{32}|[a-f0-9]{48}|[a-f0-9]{64}|[a-f0-9]{128})(?![A-Za-z0-9])
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/labelled-hex-key
