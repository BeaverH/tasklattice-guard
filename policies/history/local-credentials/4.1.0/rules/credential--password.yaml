id: credential/password
name: Explicit password assignment
description: Detect literal password/passphrase assignments in JSON, YAML, env and code, including escaped JSON
  and qualified names. Exclude variable references, calls and complete placeholder values; no request-wide exceptions.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w])(?:(?:[a-z][a-z0-9]*[_-])*(?:password[0-9]*|passwd|pwd|passphrase|pass)|(?:db|database|master|user|admin|root|smtp|redis)Password|密码)(?:\\?["'])?(?:\s*\])?\s*[:=：]\s*(?:(?P<q>\\?"|'{1,8}|\\')(?!(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{4,}|•{4,})(?P=q))[^\r\n"'\\]{4,512}(?P=q)|(?!["'\\])(?!(?:password|passwd|pwd|passphrase|pass|string|str|boolean|true|false|null|none)(?=$|[\s,;}\]]))(?![\w.]+[\[(])(?!0x[0-9a-f]+\b)(?!\$|\{|<)(?![\w.]*\.(?:env|environ)\b)[^\s,;。"'\\{}\[\]<>]{4,512}(?=$|[\s,;。}\]]))
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/password
