id: credentials-api-keys/generic_api_key
name: API Key (Generic)
description: Detects labelled API keys, access tokens, and secret keys with at least 16 token characters. Longer
  credentials remain covered; quoted JSON keys are supported.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\b(?:api[_-]?key|access[_-]?token|secret[_-]?key)["']?[\s:=]+["']?[A-Za-z0-9_\-]{16,}
on_match:
  action: block
  replacement: '[generic_api_key_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credentials-api-keys/generic_api_key
