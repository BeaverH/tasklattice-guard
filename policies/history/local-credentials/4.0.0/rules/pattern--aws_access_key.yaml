id: pattern/aws_access_key
name: AWS Access Key
description: Detects AWS access keys (AKIA...)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(AKIA[0-9A-Z]{16})\b
on_match:
  action: transform
  replacement: '[aws_access_key_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: pattern/aws_access_key
