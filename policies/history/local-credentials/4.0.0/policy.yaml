schema_version: 2
kind: Policy
metadata:
  id: local-credentials
  name: Passwords & API credentials
  description: Reject recognizable passwords, API credentials, bearer tokens, private key headers, and labelled
    hex secrets on input and output. No model is required.
  source: built_in
  version: 4.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules:
- rules/credentials-api-keys--aws_access_key.yaml
- rules/credentials-api-keys--aws_secret_key.yaml
- rules/credentials-api-keys--github_token.yaml
- rules/credentials-api-keys--slack_token.yaml
- rules/credentials-api-keys--generic_api_key.yaml
- rules/credential--bearer-token.yaml
- rules/credential--private-key-header.yaml
- rules/credential--hex-token.yaml
- rules/credential--password.yaml
- rules/advanced-au-pii-protection--credentials-api-keys--generic_api_key.yaml
- rules/pattern--aws_secret_key.yaml
- rules/pattern--github_token.yaml
- rules/pattern--slack_token.yaml
- rules/pattern--generic_api_key.yaml
- rules/pattern--aws_access_key.yaml
tests:
- tests/acceptance.yaml
