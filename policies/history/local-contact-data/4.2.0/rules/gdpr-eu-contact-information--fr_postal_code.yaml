id: gdpr-eu-contact-information/fr_postal_code
name: Postal Code (France)
description: Detects French postal codes (5 digits)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[0-9]{5}\b
    context_expression: \b(?:code\s*postal|postal\s*code|CP|zip\s*code|postcode)\b
on_match:
  action: transform
  replacement: '[fr_postal_code_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: gdpr-eu-contact-information/fr_postal_code
