id: network-infrastructure-pii/ipv4
name: IP Address (IPv4)
description: Detects IPv4 addresses
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b
on_match:
  action: transform
  replacement: '[INTERNAL_IP_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-network-addresses
  implementation_rule_id: network-infrastructure-pii/ipv4
