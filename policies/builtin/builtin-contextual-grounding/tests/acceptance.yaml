- id: grounding-output
  name: Blocks unsupported warranty claim
  description: The answer contradicts the supplied one-year warranty source.
  phase: output
  content: The warranty lasts ten years.
  context:
    query: How long is the warranty?
    grounding_sources:
    - The product warranty lasts one year.
  expected_decision: block
  covered_rule_ids: [model/contextual-grounding]
