  content: The warranty lasts one year.
  context:
    query: How long is the warranty?
    grounding_sources:
    - The product warranty lasts one year.
  expected_decision: allow
  covered_rule_ids: [model/contextual-grounding]
  kind: scenario
  scope: policy
