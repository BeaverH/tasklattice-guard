# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: local-passports
  name: Passport identifiers
  description: Redact reviewed international passport formats and context-labelled passport identifiers.
    Format matching does not establish document validity or issuing jurisdiction.
  source: built_in
  version: 3.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: collection
    value: focused-protection
    label: Focused protection
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
rules:
- rules/pattern-passport_singapore.yaml
- rules/pattern-passport_china.yaml
- rules/pattern-passport_us.yaml
- rules/pattern-passport_germany.yaml
- rules/pattern-passport_france.yaml
- rules/pattern-passport_netherlands.yaml
- rules/pattern-passport_canada.yaml
- rules/pattern-passport_india.yaml
- rules/identity-passport.yaml
tests:
- tests/local-passport-formats-acceptance.yaml
- tests/local-passport-formats-regression.yaml
- tests/acceptance.yaml
- tests/regression.yaml
