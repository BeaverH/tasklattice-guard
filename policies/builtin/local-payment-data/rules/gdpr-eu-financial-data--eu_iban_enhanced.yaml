id: gdpr-eu-financial-data/eu_iban_enhanced
name: IBAN (Enhanced EU Format)
description: Enhanced IBAN detection with more specific format validation (2 letter country + 2 check digits
  + 4 char bank code + 7 digit account base + optional 0-16 alphanumeric)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}[A-Z0-9]{0,16}\b
on_match:
  action: transform
  replacement: '[IBAN_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
runtime_adapter:
  binding_id: local-payment-data
  implementation_rule_id: gdpr-eu-financial-data/eu_iban_enhanced
