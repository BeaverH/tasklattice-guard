# yaml-language-server: $schema=../../../schemas/tests.schema.json
# These examples require the reference warranty-duration@1 reasoning policy.
- id: reasoning-output
  name: Blocks disproved warranty claim
  description: With warranty-duration@1 pinned, ten years contradicts the one-year rule.
  phase: output
  content: The warranty lasts ten years.
  context:
    query: How long is the warranty?
    expected_reasoning_result: invalid
  expected_decision: block
  covered_rule_ids: [model/automated-reasoning]
  kind: rule_acceptance
  scope: rule
- id: reasoning-valid-output
  name: Allows proved warranty claim
  description: With warranty-duration@1 pinned, one year is entailed by the rule.
  phase: output
  content: The warranty lasts one year.
  context:
    query: How long is the warranty?
    expected_reasoning_result: valid
  expected_decision: allow
  covered_rule_ids: [model/automated-reasoning]
  kind: scenario
  scope: policy
