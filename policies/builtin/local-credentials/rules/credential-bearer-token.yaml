# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credential/bearer-token
name: Bearer Token
description: Detects a case-insensitive Bearer prefix followed by at least 24 token characters, including dots in JWT-style tokens.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\bbearer\s+[A-Za-z0-9_\-\.]{24,}
on_match:
  action: block
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
