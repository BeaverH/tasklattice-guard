id: credential/private-key-header
name: Private Key Header
description: Detects RSA, EC, DSA, and OpenSSH PEM private key headers, even without the key body.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: '-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----'
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/private-key-header
