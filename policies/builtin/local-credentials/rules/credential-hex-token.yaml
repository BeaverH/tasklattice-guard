# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credential/hex-token
name: High Entropy Hex Token
description: Detects secret, token, or password labels followed by 32 to 64 hexadecimal characters. This is a format and length heuristic, not a measured entropy score. Quoted JSON keys and values are supported.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\b(?:secret|token|password)["']?[\s:=]+["']?[a-f0-9]{32,64}(?![A-Za-z0-9_])
on_match:
  action: block
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
